<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>딜 데스크 - 주소가 바뀌었습니다</title>
<meta http-equiv="refresh" content="3; url=https://mirae-dealdesk.github.io/">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1c1c1e; color: #fff; font: 15px/1.6 -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: center; padding: 20px; }
  b { color: #c9a96e; letter-spacing: .06em; }
  a { color: #c9a96e; }
</style>
</head>
<body>
<div>
  <div style="font-size:20px;font-weight:800">DEAL <b>DESK</b></div>
  <p>딜 데스크 주소가 바뀌었습니다.<br>잠시 뒤 새 주소로 넘어갑니다.</p>
  <p><a href="https://mirae-dealdesk.github.io/">https://mirae-dealdesk.github.io/</a></p>
  <p style="font-size:12px;color:#8e8e93">즐겨찾기·바탕화면 바로가기는 새 주소로 바꿔 주세요. 처음 한 번은 다시 로그인해야 합니다.</p>
</div>
<script>
  // 예전 주소(/deal-desk/)에 남은 딜 데스크 서비스워커를 지운다. PF 레이더(범위 /)는 건드리지 않는다.
  (async () => {
    try { for (const r of await navigator.serviceWorker.getRegistrations()) if (/\/deal-desk\/$/.test(r.scope)) await r.unregister(); } catch (e) { }
    location.replace('https://mirae-dealdesk.github.io/' + location.hash);
  })();
</script>
</body>
</html>
